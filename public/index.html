<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Elite Tunnel</title>
    
    <link rel="manifest" href="/manifest.json">
    <script src="/socket.io/socket.io.js"></script>

    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #050811 0%, #0b1329 100%); 
            --glass-bg: rgba(255, 255, 255, 0.04); 
            --glass-border: rgba(255, 255, 255, 0.1); 
            --neon-cyan: #0ea5e9; 
            --danger-red: #ef4444; 
            --success-green: #22c55e; 
            --warning-orange: #f97316;
        }

        body { background: var(--bg-gradient); color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100dvh; margin: 0; overflow: hidden; touch-action: manipulation; }
        .window-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.2rem; width: 92%; max-width: 450px; max-height: 98dvh; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; box-sizing: border-box; position: relative; z-index: 10; }
        .hidden { display: none !important; }

        h2 { margin-top: 0; font-size: 1.2rem; text-align: center; color: #fff; margin-bottom: 1rem; flex-shrink: 0; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; }
        input:not([type="file"]), textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: #fff; box-sizing: border-box; outline: none; font-size: 1rem; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--neon-cyan); }

        .primary-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; color: white; margin-top: 5px; background: var(--neon-cyan); }
        .secondary-btn { width: 100%; padding: 12px; border: 1px solid var(--glass-border); border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; color: #94a3b8; margin-top: 10px; background: transparent; }
        .btn-kill { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; color: var(--danger-red); margin-top: 15px; margin-bottom: 5px; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger-red); flex-shrink: 0; }

        .prime-box { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 1.5rem; border: 1px solid var(--neon-cyan); }
        .prime-label { color: var(--neon-cyan); font-size: 0.7rem; display: block; margin-bottom: 8px; }
        .prime-display-wrapper { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #display-prime { font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; }
        .copy-btn { background: rgba(14, 165, 233, 0.2); border: 1px solid var(--neon-cyan); color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: 0.2s; }
        .copy-btn:hover { background: var(--neon-cyan); }

        /* Chat UI */
        #chat-logs { flex-grow: 1; overflow-x: hidden; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin-bottom: 5px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--glass-border); scroll-behavior: smooth; }
        .chat-input-area { display: flex; gap: 8px; align-items: center; width: 100%; justify-content: space-between; flex-shrink: 0; }
        .icon-btn, #send-btn { width: 45px; height: 45px; min-width: 45px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.08); display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; color: white; margin: 0; padding: 0; }
        #send-btn { background: var(--neon-cyan); border: none; }
        #msg-input { flex-grow: 1; height: 45px; border-radius: 24px; padding: 0 15px; width: 10px; }

        .message { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 0.95rem; word-wrap: break-word; position: relative; }
        .system-msg { background: rgba(0,0,0,0.5); color: #94a3b8; align-self: center; font-size: 0.85rem; text-align: center; border: 1px solid var(--glass-border); font-weight: bold; }
        .sent-msg { background: var(--neon-cyan); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .recv-msg { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .msg-meta { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-top: 6px; display: flex; justify-content: flex-end; gap: 10px; }

        /* Video Call */
        #video-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #111; z-index: 2000; overflow: hidden; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video-wrapper { position: absolute; top: 30px; right: 20px; width: 100px; height: 140px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.5); z-index: 2001; background: #222; overflow: hidden; }
        #local-video { width: 100%; height: 100%; object-fit: cover; }
        .mirror-feed { transform: scaleX(-1); }
        .call-controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 2002; }
        .tool-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px 18px; border-radius: 16px; font-weight: bold; cursor: pointer; }
        #end-call-btn { background: var(--danger-red); color: white; padding: 12px 30px; border-radius: 16px; border: none; font-weight: bold; cursor: pointer; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .call-box { background: #0f172a; padding: 2.5rem; border-radius: 24px; text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 85%; max-width: 350px; }
        .call-actions { display: flex; gap: 15px; margin-top: 20px; }
        .btn-accept { flex: 1; padding: 12px; border-radius: 12px; border: none; background: var(--success-green); color: white; font-weight: bold; cursor: pointer; }
        .btn-reject { flex: 1; padding: 12px; border-radius: 12px; border: none; background: var(--danger-red); color: white; font-weight: bold; cursor: pointer; }
        .dev-footer { position: fixed; bottom: 15px; width: 100%; text-align: center; color: #64748b; font-size: 0.8rem; z-index: 5; }
    </style>
</head>
<body>

    <!-- SCREEN 1: AUTH -->
    <div id="screen-auth" class="window-panel">
        <h2>WebRTC Tunnel</h2>
        <div class="input-group">
            <label>Target Identifier</label>
            <input type="text" id="phone-number" placeholder="Enter target ID (e.g. Node99)">
        </div>
        <div class="input-group">
            <label>Private Key 🔐</label>
            <input type="password" id="secret-key" placeholder="Enter secret key">
        </div>
        <button id="initiate-btn" class="primary-btn">Initiate P2P Handshake</button>
    </div>

    <!-- SCREEN 2: HANDSHAKE -->
    <div id="screen-handshake" class="window-panel hidden">
        <h2>Handshake Protocol</h2>
        <div class="prime-box">
            <span class="prime-label">ACTIVE TOKEN (SHARE WITH PEER)</span>
            <div class="prime-display-wrapper">
                <span id="display-prime">00000000</span>
                <button id="copy-prime-btn" class="copy-btn" onclick="window.copyPrimeCode()">📋 Copy</button>
            </div>
        </div>
        <div class="input-group">
            <label>Confirm Prime Number</label>
            <input type="number" id="prime-input" placeholder="Paste prime code">
        </div>
        <button id="establish-btn" class="primary-btn">Establish Tunnel</button>
    </div>

    <!-- SCREEN 3: CHAT UI -->
    <div id="screen-chat" class="window-panel hidden" style="height: 100dvh; width: 100vw; border-radius: 0; max-width: 100%; border: none; padding: 1rem;">
        <h2>E2EE Network Live</h2>
        
        <div id="chat-logs">
            <div class="message system-msg" id="status-msg">⌛ Discovering Network Candidates...</div>
        </div>

        <div class="chat-input-area">
            <button onclick="window.requestCall(true)" class="icon-btn" title="Video Call">🎥</button>
            <button onclick="window.requestCall(false)" class="icon-btn" title="Voice Call">📞</button>
            <input type="text" id="msg-input" placeholder="Type an encrypted message..." onkeypress="window.checkEnter(event)">
            <button id="send-btn" onclick="window.sendMessage()">➤</button>
        </div>
        <button class="btn-kill" onclick="location.reload()">Purge Connection</button>
    </div>

    <!-- FULLSCREEN VIDEO -->
    <div id="video-container" class="hidden">
        <video id="remote-video" autoplay playsinline></video>
        <div id="local-video-wrapper">
            <video id="local-video" class="mirror-feed" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button onclick="window.toggleMute()" id="mute-btn" class="tool-btn">🎤 Mic</button>
            <button onclick="window.endCall()" id="end-call-btn">🔴 End Call</button>
        </div>
    </div>

    <div id="incoming-call-modal" class="modal hidden">
        <div class="call-box">
            <h3 id="call-title">Incoming Call...</h3>
            <div class="call-actions">
                <button onclick="window.acceptCall()" class="btn-accept">Answer</button>
                <button onclick="window.rejectCall()" class="btn-reject">Decline</button>
            </div>
        </div>
    </div>

    <div class="dev-footer">Encrypted Peer-to-Peer Tunnel Active</div>

    <!-- 🧠 CLIENT ENGINE -->
    <script>
        const socket = io(window.location.origin, {
            transports: ['websocket', 'polling'],
            reconnectionAttempts: 10
        });

        let activePrime = null;
        let isInitiator = false;
        let peerConnection = null;
        let dataChannel = null;
        let localStream = null;
        let currentCallType = null;
        let sessionRoomId = null;
        let isMuted = false;

        // Perfect Negotiation State
        let makingOffer = false;
        let ignoreOffer = false;
        let pendingCandidates = [];

        // 📋 1-Click Copy Prime Code
        window.copyPrimeCode = async function() {
            if (!activePrime) return;
            const str = activePrime.toString();
            const btn = document.getElementById('copy-prime-btn');
            try {
                await navigator.clipboard.writeText(str);
                btn.innerText = "✅ Copied!";
                setTimeout(() => { btn.innerText = "📋 Copy"; }, 2000);
            } catch (e) {
                const temp = document.createElement('textarea');
                temp.value = str;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                btn.innerText = "✅ Copied!";
                setTimeout(() => { btn.innerText = "📋 Copy"; }, 2000);
            }
        };

        // Initiate Handshake
        window.sendSecurePing = function() {
            const targetVal = document.getElementById('phone-number').value.trim();
            if (!targetVal) return alert("Target ID required!");

            isInitiator = true;
            sessionRoomId = targetVal;
            activePrime = [982451653, 15485863, 32416190071][Math.floor(Math.random() * 3)];

            document.getElementById('screen-auth').classList.add('hidden');
            document.getElementById('screen-handshake').classList.remove('hidden');
            document.getElementById('display-prime').innerText = activePrime;

            socket.emit('global_secure_ping', { prime: activePrime, targetId: sessionRoomId });
        };
        document.getElementById('initiate-btn').addEventListener('click', window.sendSecurePing);

        socket.on('global_incoming_ping', (data) => {
            const myTarget = document.getElementById('phone-number').value.trim();
            if (!myTarget || myTarget !== data.targetId) return;

            isInitiator = false;
            sessionRoomId = data.targetId;
            activePrime = data.prime;

            document.getElementById('screen-auth').classList.add('hidden');
            document.getElementById('screen-handshake').classList.remove('hidden');
            document.getElementById('display-prime').innerText = data.prime;
        });

        // Verify & Establish Tunnel
        window.verifyPrimeConnect = async function() {
            const userInputPrime = document.getElementById('prime-input').value;
            const userInputKey = document.getElementById('secret-key').value.trim();

            if (!userInputKey || parseInt(userInputPrime) !== activePrime) {
                return alert("Handshake Failed! Check Prime or Key.");
            }

            document.getElementById('screen-handshake').classList.add('hidden');
            document.getElementById('screen-chat').classList.remove('hidden');

            await initWebRTC();
            socket.emit('join_room', sessionRoomId);
        };
        document.getElementById('establish-btn').addEventListener('click', window.verifyPrimeConnect);

        // Fetch Secure Dynamic ICE Configuration from Broker Endpoint
        async function fetchIceConfig() {
            try {
                const res = await fetch('/api/ice-config');
                const data = await res.json();
                return {
                    iceServers: data.iceServers,
                    iceCandidatePoolSize: 10
                };
            } catch (err) {
                console.warn("Failed fetching broker ICE, falling back to basic STUN", err);
                return {
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                    iceCandidatePoolSize: 10
                };
            }
        }

        async function initWebRTC() {
            if (peerConnection) return;
            const config = await fetchIceConfig();
            peerConnection = new RTCPeerConnection(config);

            // W3C Perfect Negotiation Pattern
            peerConnection.onnegotiationneeded = async () => {
                try {
                    makingOffer = true;
                    await peerConnection.setLocalDescription();
                    socket.emit('webrtc_signaling', {
                        type: 'description',
                        description: peerConnection.localDescription,
                        roomId: sessionRoomId
                    });
                } catch (err) {
                    console.error("Negotiation error:", err);
                } finally {
                    makingOffer = false;
                }
            };

            peerConnection.onicecandidate = ({ candidate }) => {
                if (candidate) {
                    socket.emit('webrtc_signaling', {
                        type: 'candidate',
                        candidate: candidate.toJSON(),
                        roomId: sessionRoomId
                    });
                }
            };

            peerConnection.ontrack = (event) => {
                const remote = document.getElementById('remote-video');
                if (remote.srcObject !== event.streams[0]) {
                    remote.srcObject = event.streams[0];
                }
            };

            peerConnection.onconnectionstatechange = () => {
                const status = document.getElementById('status-msg');
                if (!status) return;
                if (peerConnection.connectionState === 'connected') {
                    status.innerText = "✅ E2EE Tunnel Active (Direct/Relay Verified)!";
                    status.style.color = "var(--success-green)";
                } else if (peerConnection.connectionState === 'connecting') {
                    status.innerText = "⌛ Establishing Transport Hole-Punch...";
                    status.style.color = "#94a3b8";
                } else if (peerConnection.connectionState === 'failed') {
                    status.innerText = "⚠️ Symmetric NAT Traversal Blocked. Retrying...";
                    status.style.color = "var(--danger-red)";
                }
            };

            if (isInitiator) {
                dataChannel = peerConnection.createDataChannel('cryptoTunnel');
                setupDataChannel();
            } else {
                peerConnection.ondatachannel = (e) => {
                    dataChannel = e.channel;
                    setupDataChannel();
                };
            }
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                const status = document.getElementById('status-msg');
                if (status) {
                    status.innerText = "✅ Military-Grade E2EE Tunnel Active!";
                    status.style.color = "var(--success-green)";
                }
            };
            dataChannel.onclose = () => {
                window.appendMsg("⚠️ Peer Disconnected.", "system-msg");
            };
            dataChannel.onmessage = (e) => {
                const parsed = JSON.parse(e.data);
                if (parsed.type === 'text') {
                    window.appendMsg(parsed.text, 'recv-msg');
                }
            };
        }

        // Signaling Hub with Glare Resolution
        socket.on('webrtc_signaling', async (data) => {
            if (!sessionRoomId || data.roomId !== sessionRoomId) return;

            try {
                if (data.type === 'peer_ready') {
                    if (isInitiator && peerConnection) {
                        // Triggers onnegotiationneeded safely
                    }
                    return;
                }

                if (data.type === 'description') {
                    const description = new RTCSessionDescription(data.description);
                    const readyForOffer = !makingOffer && (peerConnection.signalingState === "stable" || isInitiator);
                    const offerCollision = description.type === "offer" && !readyForOffer;

                    ignoreOffer = !isInitiator && offerCollision;
                    if (ignoreOffer) return;

                    await peerConnection.setRemoteDescription(description);

                    // Flush buffered ICE candidates
                    while (pendingCandidates.length > 0) {
                        await peerConnection.addIceCandidate(pendingCandidates.shift()).catch(() => {});
                    }

                    if (description.type === "offer") {
                        await peerConnection.setLocalDescription();
                        socket.emit('webrtc_signaling', {
                            type: 'description',
                            description: peerConnection.localDescription,
                            roomId: sessionRoomId
                        });
                    }
                } else if (data.type === 'candidate') {
                    try {
                        if (peerConnection && peerConnection.remoteDescription) {
                            await peerConnection.addIceCandidate(data.candidate);
                        } else {
                            pendingCandidates.push(data.candidate);
                        }
                    } catch (err) {
                        if (!ignoreOffer) console.error("Error adding candidate", err);
                    }
                } else if (data.type === 'call_request') {
                    currentCallType = data.callType;
                    document.getElementById('call-title').innerText = `Incoming ${data.callType ? 'Video' : 'Voice'} Call...`;
                    document.getElementById('incoming-call-modal').classList.remove('hidden');
                } else if (data.type === 'call_accepted') {
                    document.getElementById('video-container').classList.remove('hidden');
                    if (!localStream) await startMedia(currentCallType);
                } else if (data.type === 'call_ended' || data.type === 'peer_disconnected') {
                    window.endCall(false);
                    window.appendMsg("Call ended / Peer disconnected.", "system-msg");
                }
            } catch (err) {
                console.error("Signaling pipeline fault:", err);
            }
        });

        // Chat & Call Controls
        window.sendMessage = function() {
            if (!dataChannel || dataChannel.readyState !== 'open') {
                return alert("Tunnel not ready yet!");
            }
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            window.appendMsg(text, 'sent-msg');
            dataChannel.send(JSON.stringify({ type: 'text', text }));
            input.value = '';
        };

        window.appendMsg = function(text, type) {
            const logs = document.getElementById('chat-logs');
            logs.insertAdjacentHTML('beforeend', `<div class="message ${type}">${text}</div>`);
            logs.scrollTop = logs.scrollHeight;
        };

        window.checkEnter = function(e) {
            if (e.key === 'Enter') window.sendMessage();
        };

        window.requestCall = async function(video) {
            currentCallType = video;
            const ok = await startMedia(video);
            if (ok) {
                document.getElementById('video-container').classList.remove('hidden');
                socket.emit('webrtc_signaling', { type: 'call_request', callType: video, roomId: sessionRoomId });
            }
        };

        window.acceptCall = async function() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            document.getElementById('video-container').classList.remove('hidden');
            await startMedia(currentCallType);
            socket.emit('webrtc_signaling', { type: 'call_accepted', roomId: sessionRoomId });
        };

        window.rejectCall = function() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            socket.emit('webrtc_signaling', { type: 'call_ended', roomId: sessionRoomId });
        };

        async function startMedia(video) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: video ? { facingMode: 'user', width: { ideal: 1280 } } : false
                });
                document.getElementById('local-video').srcObject = localStream;
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                return true;
            } catch (e) {
                alert("Media permission denied!");
                return false;
            }
        }

        window.endCall = function(emit = true) {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.getSenders().forEach(sender => {
                    if (sender.track) {
                        try { peerConnection.removeTrack(sender); } catch (e) {}
                    }
                });
            }
            document.getElementById('video-container').classList.add('hidden');
            if (emit && socket) {
                socket.emit('webrtc_signaling', { type: 'call_ended', roomId: sessionRoomId });
            }
        };

        window.toggleMute = function() {
            if (localStream && localStream.getAudioTracks().length > 0) {
                isMuted = !isMuted;
                localStream.getAudioTracks()[0].enabled = !isMuted;
                document.getElementById('mute-btn').innerText = isMuted ? "🔇 Muted" : "🎤 Mic";
            }
        };
    </script>
</body>
</html>
